# cfig-eligibility -- the Carrier Eligibility Tool on Cloudflare (round 43 step 3).
# This file lives at the REPO ROOT; every path below is relative to it.
# Schema: node_modules/wrangler/config-schema.json (wrangler 4.149.0, pinned in the root package.json).
name = "cfig-eligibility"
main = "cloudflare/src/worker.js"
compatibility_date = "2026-10-01"

# Liam, 2026-10-24: a workers.dev address for now (cfigtx.com's DNS is not known yet). Round 44 (Liam, 2026-10-25):
# until Cloudflare Access is on, the Worker's own password gate protects every path (AUTH_MODE below), and it fails
# closed while its secrets are missing -- so the address can be on from the first deploy: before the secrets are set
# it shows only "isn't set up yet". Preview URLs stay off. A custom domain later:
#   routes = [{ pattern = "eligibility.cfigtx.com", custom_domain = true }]
workers_dev = true
preview_urls = false

# Round 44b (Liam, 2026-10-25): the placement tables are part of the Worker, not D1 (loading them into D1 blew the free
# tier's 100k rows written a day). Before every `wrangler deploy` and `wrangler dev`, wrangler runs this: it turns
# rules_data/placement/*.csv into cloudflare/build/placement_data.js, which routes.js imports. So a push with new CSVs
# deploys new tables, and a bad CSV fails the build (the live version stays). The module is git-ignored and never in
# web/dist: the browser never gets the tables.
# Round 45: the same step builds Ask the Guides' material (cloudflare/build/chat_index.js) from rules_data/chat and the
# rules tables, also part of the Worker and never in web/dist.
[build]
command = "node cloudflare/scripts/build_placement.mjs && node cloudflare/scripts/build_chat_index.mjs"
watch_dir = ["cloudflare/src", "rules_data"]

[assets]
directory = "web/dist"
binding = "ASSETS"
# Round 44: the Worker runs first for EVERY path, so the password gate sees the page, the scripts, the engine bundle
# and the rules data before they are served (each is a Worker request; well inside the free plan). Under Access this
# can go back to ["/api/*"] (DEPLOY_CLOUDFLARE.md, "Later: Cloudflare Access").
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cfig-eligibility"
# Printed by `npx wrangler d1 create cfig-eligibility` (Liam, once). A placeholder works for --local.
database_id = "dca0e63f-c783-474d-9412-126ab1e345eb"
migrations_dir = "cloudflare/migrations"

[vars]
# Round 44 (Liam, 2026-10-25): "password" until Cloudflare Access is on, then "access" (DEPLOY_CLOUDFLARE.md).
# Password mode needs three secrets, set with `npx wrangler secret put` and never written here or in git:
# APP_PASSWORD (the agents'), ADMIN_PASSWORD (a different one: feedback download, weekly counts), SESSION_SECRET
# (32+ random characters; changing it signs everyone out). Any missing: every path refuses.
AUTH_MODE = "password"
ACCESS_TEAM_DOMAIN = "cfig.cloudflareaccess.com"        # Zero Trust -> Settings -> Custom pages: the team domain
ACCESS_AUD = "REPLACE-WITH-THE-ACCESS-APPLICATION-AUD-TAG"   # Zero Trust -> Access -> Applications -> the app -> Overview
# Comma list, case-insensitive. Jonathan's address is not known yet: replace the placeholder.
ADMIN_EMAILS = "liam@cfigtx.com,JONATHAN-ADDRESS-TBD@cfigtx.com"
# Round 45 (Liam, 2026-10-28): Ask the Guides. The model (any Claude model id; Sonnet 5.5 since round 46, was Haiku 5.5), the daily spend
# cap across everyone (US dollars, UTC day) and the questions one login may ask an hour. The Anthropic key is a secret:
# `npx wrangler secret put ANTHROPIC_API_KEY` (never here). Without it the chat says it isn't set up; the checker works.
CHAT_MODEL = "claude-sonnet-5-5"
CHAT_DAILY_CAP_USD = "3"
CHAT_RATE_PER_HOUR = "30"
# DEV_AUTH_EMAIL must NOT be set here. Local only, in .dev.vars (git-ignored) or `wrangler dev --var`:
#   DEV_AUTH_EMAIL=liam@cfigtx.com
# The Worker honours it only for plain-http requests to localhost / 127.0.0.1 / [::1].

[observability]
enabled = true
